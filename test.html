<!DOCTYPE html>
<html lang="en">
   
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <style>
    body {
      font-family: Arial, sans-serif;
    }
    .todo-list {
      list-style: none;
      padding: 0;
    }
    .todo-item {
      padding: 10px;
      margin: 5px 0;
      background-color: #f4f4f4;
      border: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .todo-item.completed {
      text-decoration: line-through;
      background-color: #d3f9d8;
    }
    button {
      background-color: #ff5733;
      color: white;
      border: none;
      padding: 5px 10px;
      cursor: pointer;
    }
    button:hover {
      background-color: #ff3d00;
    }

    .paragraphClass{
      color: #ff3d00;
      font-size: large;
    }

    canvas {
      border: 1px solid black;
      display: block;
      margin: 20px auto;
    }
  </style>

</head>
<body>
  <h1 id="hi">To-Do List</h1>
  <input type="text" id="todoInput" placeholder="Enter a new to-do" />
  <button id="addButton" onclick="alerttodo()" draggable="true" ondragstart="drag(event)">Add</button>
  <ul class="todo-list" id="todoList" ondragover="allowDrop(event)"></ul>

  <div id="div1" ondrop="drop(event)" ondragover="allowDrop(event)">jhjkl</div>

  <a id="myLink" href="https://www.google.com">google</a>
  <br>
  <button onclick="google()">google</button>
  <button onclick="amazon()">amazon</button>

  <p id="toggle">toggle text</p>

  <button onclick="toggleClass()">Toggle button</button>


  <canvas id="myCanvas" width="800" height="600"></canvas>

  <script>
   let element = document.getElementById("hi");
   element.textContent = 'Hi!';
   element.style.color='blue';



  function alerttodo(){
    let todoInput = document.getElementById("todoInput");

    alert(todoInput.value);
  }

  function allowDrop(ev) {
  ev.preventDefault();
}

function drag(ev) {
  ev.dataTransfer.setData("text", ev.target.id);
}

function drop(ev) {
  ev.preventDefault();
  var data = ev.dataTransfer.getData("text");
  ev.target.appendChild(document.getElementById(data));
}
function google()
{
  document.getElementById("myLink").textContent="google";
  document.getElementById("myLink").setAttribute("href", "https://www.google.com");
}

function amazon()
{
  document.getElementById("myLink").textContent="amazon";

  document.getElementById("myLink").setAttribute("href", "https://www.amazon.com");
}

function toggleClass() {

  let p = document.getElementById("toggle");
  p.classList.toggle("paragraphClass");
}
 

const canvas = document.getElementById("myCanvas");
const ctx = canvas.getContext("2d"); 
ctx.beginPath();
ctx.moveTo(0,0);
ctx.lineTo(200,100);
ctx.stroke();
 
  </script>

  
</body>
</html>
