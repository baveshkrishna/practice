<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Click and Drag Line</title>
  <style>
    canvas {
      border: 1px solid black;
      display: block;
      margin: 20px auto;
    }
  </style>
</head>
<body>
  <canvas id="lineCanvas" width="600" height="400"></canvas>
  <script>
    const canvas = document.getElementById('lineCanvas');
    const ctx = canvas.getContext('2d');

    let isDrawing = false;
    let lineStart = null;
    let lineEnd = null;

    // Draw the line
    function drawCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height); // Clear the canvas

      if (lineStart && lineEnd) {
        ctx.beginPath();
        ctx.moveTo(lineStart.x, lineStart.y);
        ctx.lineTo(lineEnd.x, lineEnd.y);
        ctx.strokeStyle = 'blue';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }

    // Mouse down event - Start drawing
    canvas.addEventListener('mousedown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      lineStart = { x: mouseX, y: mouseY }; // Set the starting point
      lineEnd = null; // Reset the end point
      isDrawing = true;
    });

    // Mouse move event - Update line dynamically
    canvas.addEventListener('mousemove', (e) => {
      if (isDrawing) {
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        lineEnd = { x: mouseX, y: mouseY }; // Update the end point
        drawCanvas();
      }
    });

    // Mouse up event - Finish drawing
    canvas.addEventListener('mouseup', () => {
      isDrawing = false; // Stop drawing
    });

    // Initial clear
    drawCanvas();
  </script>
</body>
</html>
